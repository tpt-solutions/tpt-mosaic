[package]
name        = "tpt-mosaic-core"
version     = "0.1.0"
description = "Shared foundation types, traits, error enums, and constants for the tpt-mosaic workspace"
readme = "README.md"
keywords = ["mosaic", "quorum", "byzantine", "distributed-compute", "no-std"]
categories = ["data-structures", "network-programming", "no-std", "api-bindings"]
authors.workspace    = true
license.workspace    = true
edition.workspace    = true
rust-version.workspace = true
repository.workspace  = true
homepage.workspace   = true
documentation = "https://docs.rs/tpt-mosaic-core"

[features]
default = []
std     = []

[dependencies]
bitflags = { workspace = true }
