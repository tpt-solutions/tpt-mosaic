[workspace]
members = [
    "benches",
    "crates/tpt-mosaic-core",
    "crates/tpt-mosaic-proto",
    "crates/tpt-mosaic-discovery",
    "crates/tpt-mosaic-scheduler",
    "crates/tpt-mosaic-task",
    "crates/tpt-mosaic-compiler",
    "crates/tpt-mosaic-sandbox",
    "crates/tpt-mosaic-quorum",
    "crates/tpt-mosaic-verify",
    "crates/tpt-mosaic-economy",
    "crates/tpt-mosaic-node",
]
resolver = "2"

[workspace.package]
authors = ["TPT Solutions"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.80"
repository = "https://github.com/tpt-solutions/tpt-mosaic"
homepage = "https://github.com/tpt-solutions/tpt-mosaic"

[workspace.dependencies]
# Internal crates
tpt-mosaic-core      = { path = "crates/tpt-mosaic-core" }
tpt-mosaic-proto     = { path = "crates/tpt-mosaic-proto" }
tpt-mosaic-discovery = { path = "crates/tpt-mosaic-discovery" }
tpt-mosaic-scheduler = { path = "crates/tpt-mosaic-scheduler" }
tpt-mosaic-task      = { path = "crates/tpt-mosaic-task" }
tpt-mosaic-compiler  = { path = "crates/tpt-mosaic-compiler" }
tpt-mosaic-sandbox   = { path = "crates/tpt-mosaic-sandbox" }
tpt-mosaic-quorum    = { path = "crates/tpt-mosaic-quorum" }
tpt-mosaic-verify    = { path = "crates/tpt-mosaic-verify" }
tpt-mosaic-economy   = { path = "crates/tpt-mosaic-economy" }

# External tpt-solutions ecosystem crates (sub-crates of the four GitHub workspaces).
# Pinned to verified revisions; bump deliberately.
tpt-gpu-runtime       = { git = "https://github.com/tpt-solutions/tpt-gpu",      rev = "e346589a5ee4591486693ee520d7cdf3db7440aa" }
tpt-crucible-common   = { git = "https://github.com/tpt-solutions/tpt-crucible", rev = "0ef1dca7c0f1682becef1d024097ce02d8589b36" }
tpt-crucible-catalyst = { git = "https://github.com/tpt-solutions/tpt-crucible", rev = "0ef1dca7c0f1682becef1d024097ce02d8589b36" }
tpt-archon-kernel     = { git = "https://github.com/tpt-solutions/tpt-archon",   rev = "928c00dec13560844a52222e3d02107516a7c09d" }
tpt-archon-bridge     = { git = "https://github.com/tpt-solutions/tpt-archon",   rev = "928c00dec13560844a52222e3d02107516a7c09d" }
tpt-archon-core       = { git = "https://github.com/tpt-solutions/tpt-archon",   rev = "928c00dec13560844a52222e3d02107516a7c09d" }
tpt-eve-symbolic      = { git = "https://github.com/tpt-solutions/tpt-eve",      rev = "c230d0e83633bd0a7f8d3e6a5d830f48236427ad" }
tpt-eve-core          = { git = "https://github.com/tpt-solutions/tpt-eve",      rev = "c230d0e83633bd0a7f8d3e6a5d830f48236427ad" }

# Shared third-party dependencies
bitflags    = "2"
blake3      = { version = "1", default-features = false }
sha2        = { version = "0.10", default-features = false }
flatbuffers = "24"
criterion   = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
mdns-sd     = "0.11"
proptest    = "1"
toml        = { version = "0.8", default-features = false, features = ["parse"] }
tracing     = "0.1"
tokio       = { version = "1", features = ["full"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 1
