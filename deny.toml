# cargo-deny configuration (CI runs `cargo deny check`).
# https://embarkstudios.github.io/cargo-deny/

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[advisories]
version = 2
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The upstream tpt-* backends are git dependencies by design.
allow-git = ["https://github.com/tpt-solutions/tpt-gpu", "https://github.com/tpt-solutions/tpt-crucible", "https://github.com/tpt-solutions/tpt-archon", "https://github.com/tpt-solutions/tpt-eve"]
