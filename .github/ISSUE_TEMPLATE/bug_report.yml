name: Bug report
description: Report something that is broken or incorrect
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search existing
        issues first — if yours is a security vulnerability, use
        [private reporting](https://github.com/tpt-solutions/tpt-mosaic/security/advisories/new)
        instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. master @ b8dbbc5 or v0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Config, commands, and logs (`MOSAIC_LOG=debug` helps).
      placeholder: |
        1. cargo run -p tpt-mosaic-node --example two_node_mesh
        2. ...
    validations:
      required: true
